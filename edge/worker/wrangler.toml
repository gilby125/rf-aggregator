# rf-aggregator edge: one Worker serves the UI (static assets, same-origin — avoids the
# Access CORS preflight gotcha) and the API. See docs/DEPLOY.md for full setup.
name = "rf-aggregator-edge"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Custom domain (CF auto-creates the DNS record + TLS cert on deploy). The Access
# application must also list this hostname, or /api/* returns 401 (static assets +
# radar still serve). doppelops.com is a Cloudflare zone.
routes = [
  { pattern = "weather.doppelops.com", custom_domain = true }
]
# keep the *.workers.dev URL working too (adding routes disables it otherwise)
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "rf_aggregator"
database_id = "aacd1153-86cb-41c8-a4dc-a5dc6198beec"

[vars]
# https://<your-team>.cloudflareaccess.com
TEAM_DOMAIN = "https://throughfire.cloudflareaccess.com"
# The Access application AUD tag (Zero Trust > Access > Applications > your app)
POLICY_AUD = "bd45a4ad70c43548732eea166f05cbffe5aa172b7f05f8d7b3c7effb19861816"
# "1" only in local dev (.dev.vars) — skips Access JWT verification
DEV_MODE = "0"

# Secrets (kept out of the repo — set with `wrangler secret put <NAME>`, or in .dev.vars locally):
#   BRIDGE_TOKEN  — shared bearer for /api/bridge/* (must match backend/.env)
#   ADMIN_EMAILS  — comma-separated emails bootstrapped as admins on first sign-in
