# rtl_433 adapter: native rtl_433 MQTT JSON -> rf_event envelope (see docs/CONTRACTS.md §1).
#
# ADAPTERS ARE INPUT-ONLY. Declare inputs and identity tags here; NEVER a processor.
# Telegraf processors are global — one declared here would rewrite every other adapter's
# metrics too, silently. This adapter's id template therefore lives in
# backend/telegraf/telegraf.conf, scoped with tagpass source=["rtl433"].
#
# To support another decoder: write a sibling adapters/<decoder>/adapter.conf producing the
# same rf_event shape, then add a --config flag and a mount for it in
# backend/docker-compose.yml. Multiple adapters run side by side.

[[inputs.mqtt_consumer]]
  servers = ["${FEED_MQTT_URL}"]
  topics = ["${FEED_TOPIC}"]
  ## qos 0 on purpose: qos>0 makes Telegraf wrap events in tracking metrics, which breaks
  ## the gateway outputs.mqtt topic templates ({{ .Tag ... }}); rtl_433 sensors rebroadcast
  ## every few seconds, so delivery guarantees add nothing here.
  qos = 0
  client_id = "rf-aggregator-in"
  data_format = "json"
  name_override = "rf_event"
  ## rtl_433 numeric fields become envelope fields; strings are dropped except identity tags.
  tag_keys = ["model", "id", "channel"]
  json_time_key = "time"
  json_time_format = "unix"
  [inputs.mqtt_consumer.tags]
    source = "rtl433"
    type = "sensor"

## The id template that builds "<model>-<id>[-<channel>]" is NOT here by design — it is a
## processor, and processors are global. See backend/telegraf/telegraf.conf (order=1).
