# rtl_433 adapter: native rtl_433 MQTT JSON -> rf_event envelope (see docs/CONTRACTS.md §1).
# This file is the whole adapter. To support another decoder, write a sibling
# adapters/<decoder>/adapter.conf producing the same rf_event shape and mount it instead.

[[inputs.mqtt_consumer]]
  servers = ["${FEED_MQTT_URL}"]
  topics = ["${FEED_TOPIC}"]
  ## qos 0 on purpose: qos>0 makes Telegraf wrap events in tracking metrics, which breaks
  ## the gateway outputs.mqtt topic templates ({{ .Tag ... }}); rtl_433 sensors rebroadcast
  ## every few seconds, so delivery guarantees add nothing here.
  qos = 0
  client_id = "rf-aggregator-in"
  data_format = "json"
  name_override = "rf_event"
  ## rtl_433 numeric fields become envelope fields; strings are dropped except identity tags.
  tag_keys = ["model", "id", "channel"]
  json_time_key = "time"
  json_time_format = "unix"
  [inputs.mqtt_consumer.tags]
    source = "rtl433"
    type = "sensor"

## Envelope id = stable "<model>-<id>[-<channel>]" (contract: stable across restarts).
[[processors.template]]
  order = 1
  namepass = ["rf_event"]
  tag = "id"
  template = '{{ .Tag "model" }}-{{ .Tag "id" }}{{ if .Tag "channel" }}-{{ .Tag "channel" }}{{ end }}'
