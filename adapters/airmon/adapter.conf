# airmon adapter: airmon_poller.py's native MQTT JSON -> rf_event envelope
# (see docs/CONTRACTS.md section 1).
#
# Unlike adapters/rtl433/, this adapter is NOT config-only: the Airmon has no external
# decoder, so airmon_poller.py in this directory is the decoder. It must run within BLE
# range of the device and publishes to AIRMON_TOPIC; this file normalises that stream.

[[inputs.mqtt_consumer]]
  servers = ["${FEED_MQTT_URL}"]
  topics = ["${AIRMON_TOPIC}"]
  ## qos 0 to match the rtl433 adapter: qos>0 makes Telegraf wrap events in tracking
  ## metrics, which breaks the gateway outputs.mqtt topic templates ({{ .Tag ... }}).
  qos = 0
  client_id = "rf-aggregator-in-airmon"
  data_format = "json"
  name_override = "rf_event"
  ## The poller emits the envelope id directly, so no processors.template is needed here
  ## (the rtl433 adapter has to synthesise one from model/id/channel).
  tag_keys = ["id"]
  json_time_key = "time"
  json_time_format = "unix"
  [inputs.mqtt_consumer.tags]
    source = "airmon"
    type = "sensor"

## Field naming note: this device reports CELSIUS, so fields are temperature_C - distinct
## from the rtl433 adapter's temperature_F. aggregators.basicstats computes per-group means
## by field name, so keeping the names distinct prevents Celsius and Fahrenheit readings
## being averaged together into a meaningless number if a group ever spans both sources.
