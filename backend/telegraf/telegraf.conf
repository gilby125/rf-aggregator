# rf-aggregator core pipeline. Adapters (adapters/<decoder>/adapter.conf) contribute INPUTS
# ONLY; every processor lives here. The id->group lookup is rendered by the bridge into
# /etc/telegraf/dynamic/telegraf.d/ (watched: a rewrite there triggers a config reload, which
# is when the mapping file is re-read — processors.lookup is startup-static by design).
#
# ADAPTERS ARE INPUT-ONLY — DO NOT PUT PROCESSORS IN AN ADAPTER CONFIG.
# Telegraf processors are global: there is no per-adapter namespace, so a processor declared
# in one adapter's file also rewrites every OTHER adapter's metrics. That is silent data
# corruption, not an error. (Real case: rtl433's id template ran on airmon envelopes and
# produced id="-airmon001-026210" — empty model, leading dash.)
# Any processor that must apply to one source only belongs HERE, with an explicit
# [processors.<name>.tagpass] source = ["<that source>"].

[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "10s"
  flush_jitter = "2s"
  omit_hostname = true
  ## Explicit (becomes the default in v1.40): agg output must not re-enter the processor
  ## chain; our processors namepass rf_event only, so this is also a no-op today.
  skip_processors_after_aggregators = true

## rtl433 envelope id = "<model>-<channel>" when the device emits a channel, else
## "<model>-<id>". The identity must be stable across a battery change, and the rtl_433
## `id` is NOT: the Acurite decoders (src/devices/acurite.c) document it as volatile —
## "ID byte, changes at each power up" / "Device ID (14 bits), volatie, resets at power up"
## / "The sensor ID changes on each power-up of the sensor." A battery swap or low-battery
## brown-out reset rolls the id, which spawns a ghost sensor and severs history. `channel`
## is the physical A/B/C slider position (acurite.c: channel = high 2 bits of byte 0); a
## power cycle does not move the slider, so model+channel survives battery changes.
##
## ASSUMPTION worth verifying on the next battery swap: that `channel` really is stable
## across a power cycle. An earlier revision of this file claimed channel "flips when
## batteries are pulled" and keyed on model+id to avoid it — but that claim has no source
## and the rtl_433 decoder only documents `id` as volatile, not channel. If a swap ever
## shows channel changing, revert to model+id and build the alias/merge layer instead.
##
## TRADEOFFS: only 3 channels exist (A/B/C), so at most 3 units per model, and two units of
## the same model on the same channel collapse into one id. Channel-less models (no slider)
## fall through to model+id and stay on the volatile id — no regression, no improvement.
##
## MIGRATION (one-time): channel-emitting sensors get a NEW id under this scheme, so their
## catalog/history re-splits once, and any group_defs keyed on the old "<model>-<id>" must
## be reassigned to the new "<model>-<channel>" id.
##
## Lives here, not in adapters/rtl433/adapter.conf, because processors are global — see the
## header. tagpass scopes it to rtl433 so it cannot touch other sources' ids.
## Adapters whose decoder already emits a final id (e.g. airmon) need no processor at all.
[[processors.template]]
  order = 1
  namepass = ["rf_event"]
  tag = "id"
  template = '{{ .Tag "model" }}-{{ if .Tag "channel" }}{{ .Tag "channel" }}{{ else }}{{ .Tag "id" }}{{ end }}'
  [processors.template.tagpass]
    source = ["rtl433"]

## order=2 is reserved: processors.lookup (id -> group tag), bridge-rendered snippet.

## Any envelope the lookup didn't map gets group=unassigned (surfaces in the UI per plan).
[[processors.starlark]]
  order = 3
  namepass = ["rf_event"]
  source = '''
def apply(metric):
    if "group" not in metric.tags:
        metric.tags["group"] = "unassigned"
    return metric
'''

## Per-group mean over AGG_PERIOD. taginclude collapses per-sensor series into one per group;
## applies only to numeric sensor envelopes (other domains pass through un-aggregated).
[[aggregators.basicstats]]
  period = "${AGG_PERIOD}"
  drop_original = false
  namepass = ["rf_event"]
  name_suffix = "_agg"
  stats = ["mean"]
  taginclude = ["group"]
  [aggregators.basicstats.tagpass]
    type = ["sensor"]

## Retain: raw envelopes (rf_event) + aggregates (rf_event_agg) in one bucket.
[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

## Gateway out: normalized raw stream.
[[outputs.mqtt]]
  servers = ["${FEED_MQTT_URL}"]
  client_id = "rf-aggregator-gw-raw"
  namepass = ["rf_event"]
  layout = "non-batch"
  topic = 'rf/events/{{ index .Tags "id" }}'
  data_format = "json"
  json_timestamp_units = "1s"

## Gateway out: per-group aggregates, retained so late subscribers get the latest window.
[[outputs.mqtt]]
  servers = ["${FEED_MQTT_URL}"]
  client_id = "rf-aggregator-gw-agg"
  namepass = ["rf_event_agg"]
  layout = "non-batch"
  retain = true
  topic = 'rf/agg/{{ index .Tags "group" }}'
  data_format = "json"
  json_timestamp_units = "1s"
